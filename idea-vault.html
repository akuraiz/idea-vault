          <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search ideas" autocomplete="off" aria-label="Search ideas" /></label>
          <select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="next">Best to do first</option><option value="dusty">Not touched longest</option></select>
        </div>
        <nav class="chips" id="filters" aria-label="Filter by status"></nav>
        <nav class="chips tags" id="tagbar" aria-label="Filter by tag"></nav>
        <div id="list" class="list" data-diff></div>
      </section>
      <aside id="panel" class="panel" aria-label="Idea details"></aside>
    </div>
    <div id="scrim" class="scrim"></div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-nav="ideas" class="on" aria-label="Ideas" aria-current="page"><svg class="ic"><use href="#i-list"/></svg><span>Ideas</span></button>
      <button data-nav="search" aria-label="Search" aria-current="false"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></button>
      <button data-nav="add" class="add" aria-label="Add a new idea"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button data-nav="surprise" aria-label="Surprise me"><svg class="ic"><use href="#i-dice"/></svg><span>Surprise</span></button>
      <button data-nav="me" id="nav-me" aria-label="My account and settings"><svg class="ic"><use href="#i-user"/></svg><span>Me</span></button>
    </nav>
  </div>

  <dialog id="wizard" class="sheet" aria-label="Make your idea clearer"></dialog>
  <dialog id="surprise" class="sheet" aria-label="Surprise me"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
